<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon/jpg" href="../img/cat2.jpg" sizes="16x16">
  <title>button, don't run away! (run please)</title>
</head>
<style>
  button {
    background-color: red;
    border: none;
    cursor: pointer;
    z-index: 1;
    transition: .2s;
    padding: 20px 30px;
    font-size: 20px;
    border-radius: 10px;
    color: white;
  }
  button:hover {
   box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.2);
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: pink;
    font-family: poppins, sans-serif;
    padding: 10px;
    height: 90vh;
  }
  section {
    background-color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
  }
 
  .buttons {
    display: flex;
    gap: 20px;
    margin-top: 20px;
  }

  /* Popup styles */
  .popup {
    position: fixed;
    background-color: rgb(226, 80, 117);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    animation: popupAnimation 1s;
    z-index: 1;
    color: rgb(255, 255, 255);
  }

  @keyframes popupAnimation {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }


  /* yes button shake animation */
  .yes-btn-shake {
    animation: shake 0.5s;
    animation-iteration-count: infinite;
  }

  @keyframes shake {
    0% {
      transform: translate(1px, 1px) rotate(0deg);
    }
    10% {
      transform: translate(-1px, -2px) rotate(-1deg);
    }
    20% {
      transform: translate(-3px, 0px) rotate(1deg);
    }
    30% {
      transform: translate(3px, 2px) rotate(0deg);
    }
    40% {
      transform: translate(1px, -1px) rotate(1deg);
    }
    50% {
      transform: translate(-1px, 2px) rotate(-1deg);
    } 
    60% {
      transform: translate(-3px, 1px) rotate(0deg);
    }
    70% {
      transform: translate(3px, 1px) rotate(-1deg);
    }
    80% {
      transform: translate(-1px, -1px) rotate(1deg);
    }
    90% {
      transform: translate(1px, 2px) rotate(0deg);
    }
  }


 
</style>
<audio src="swishcut.mp3" style="display: none" id="swish"></audio>
<body>
 

  <section>
    <h1>Will you be my valentine?</h1>
    <div class="buttons">
      <button class="yes-btn" id="yes-button">YES</button>
      <button id="no-button">NO</button>
    </div>
  </section>

  <section class="popup">
    <div class="popup-content">
        <h2>Thank you for accepting my proposal!</h2>
        <p>I am so happy to have you as my valentine. I promise to love and cherish you forever.</p>
        <button class="close-btn" onclick="location.reload()">Close</button>
    </div>
  </section>
  
  
  <script>
    // when hovering the button, it will move to a random position
    const noBtn = document.getElementById('no-button');
    const swish = document.getElementById('swish');

    noBtn.addEventListener('mouseover', () => {
      swish.play();

     // trigger yes button shake animation when hovering the no button multiple times
        const yesBtn = document.getElementById('yes-button');
        yesBtn.classList.add('yes-btn-shake');
        setTimeout(() => {
          yesBtn.classList.remove('yes-btn-shake');
        }, 4000);
  
        // move the no button to a random position
        

      const x = Math.floor(Math.random() * window.innerWidth);
      const y = Math.floor(Math.random() * window.innerHeight);
      document.querySelector("body").style.position = "relative";
      noBtn.style.position = 'absolute';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

    });

   


    // popup when clicking the yes button
    const yesBtn = document.getElementById('yes-button');
    const popup = document.querySelector('.popup');
    const closeBtn = document.querySelector('.close-btn');

    popup.style.display = 'none';
    

    yesBtn.addEventListener('click', () => {
      popup.style.display = 'flex';
      noBtn.style.display = 'none';
    });
    closeBtn.addEventListener('click', () => {
      popup.style.display = 'none';
      window.location.href = "../index.html";
    });
    

  </script>
</body>
</html>
