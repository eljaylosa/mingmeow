<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon/jpg" href="../img/cat2.jpg" sizes="16x16">
  <title>button, don't run away! (run please)</title>
</head>
<style>

:root {
  --pink1: #ff5f9e;
  --pink2: #ff9a9e;
  --red: #ff2f68;
  --green1: #2ecc71;
  --green2: #1e8449;
}

  button {
    background-color: rgb(255, 0, 140);
    border: none;
    cursor: pointer;
    z-index: 1;
    transition: .2s;
    padding: 20px 30px;
    font-size: 20px;
    border-radius: 10px;
    color: rgb(245, 245, 245);
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
  }
  button:hover {
   box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.2);
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: pink;
    font-family: poppins, sans-serif;
    padding: 10px;
    height: 96vh;
  
    background: linear-gradient(
      rgba(230, 160, 193, 0.2),
      rgba(223, 93, 208, 0.5)
    ),
    url("img/cat2.jpg");
    background-size: cover;       
    background-position: center; 
    background-repeat: no-repeat;
  }
html, body {
  overflow: hidden;
}
 
  .main {
    background-color: transparent;
    backdrop-filter: blur(5px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255, 0, 140, 0.3);

    animation: slideUp 2s ease-out;
  }

  @keyframes slideUp {
    0% {
      transform: translateY(50px);
      opacity: 0;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }

  /* Title */
  .main h1 {
    color: #ff0973;
    font-size: 28px;
    margin-bottom: 10px;
    text-shadow: black 1px 1px 2px, black 0 0 1em, black 0 0 0.2em;
  }

  /* Add cute cat emoji decoration */
  .main h1::after {
    content: " 🐱💖";
  }
 
  .buttons {
    display: flex;
    gap: 20px;
    margin-top: 20px;
  }

  /* Popup styles */
  .popup {
    border-radius: 20px;
    padding: 20px;
    position: fixed;
    background: linear-gradient(180deg, var(--pink1), var(--pink2));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: popupAnimation .75s;
    z-index: 1;
    color: rgb(255, 255, 255);
  }

  @keyframes popupAnimation {
    0% {
      transform: scale(0.5);
      opacity: 0;
    }
    50% {
      transform: scale(2);
      opacity: 1;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }


  /* yes button shake animation */
  .yes-btn-shake {
    animation: shake 0.5s;
    animation-iteration-count: infinite;
  }

  @keyframes shake {
    0% {
      transform: translate(1px, 1px) rotate(0deg);
    }
    10% {
      transform: translate(-1px, -2px) rotate(-1deg);
    }
    20% {
      transform: translate(-3px, 0px) rotate(1deg);
    }
    30% {
      transform: translate(3px, 2px) rotate(0deg);
    }
    40% {
      transform: translate(1px, -1px) rotate(1deg);
    }
    50% {
      transform: translate(-1px, 2px) rotate(-1deg);
    } 
    60% {
      transform: translate(-3px, 1px) rotate(0deg);
    }
    70% {
      transform: translate(3px, 1px) rotate(-1deg);
    }
    80% {
      transform: translate(-1px, -1px) rotate(1deg);
    }
    90% {
      transform: translate(1px, 2px) rotate(0deg);
    }
  }

  .no-button-animation {
    animation: UIAICatMeme .1s infinite;
  }
  @keyframes UIAICatMeme {
    0% { transform: rotateX(90deg); }
    50% { transform: rotateY(180deg); }
    100% { transform: rotateX(360deg); }
  }

  #happy-cat {
  width: 300px;
  margin-top: 20px;
  border-radius: 10px;
}

nav {
  position: absolute;
  top: 20px;
  left: 20px;
}
nav button{
  padding: 10px 20px;
}
 
</style>


<body>
  <nav>
    <a href="../flowers-for-you/flowers.html"><button>Back</button></a>
  </nav>
  <audio src="swishcut.mp3" style="display: none" id="swish"></audio>
  <audio src="sfx/cutver/uia.mp3" style="display: none;" id="uia"></audio>
  <audio src="sfx/cutver/meow.mp3" style="display: none;" id="meow"></audio>
  <audio src="sfx/cutver/confetti.mp3" style="display: none;" id="confetti"></audio>
  <audio src="sfx/cutver/baloon pop.mp3" style="display: none;" id="baloon-pop"></audio>
  

  <section class="main">
    <h1>Will you be my valentine?</h1>
    <div class="buttons">
      <button class="yes-btn" id="yes-button">Yes</button>
      <button id="no-button">No</button>
    </div>
  </section>
  
    
  <section class="popup">
    <video src="video/happy happy.mp4" id="happy-cat"></video>
     <div class="popup-content">
       <h2>Thank you for accepting my proposal!</h2>
       <p>I am so happy to have you as my valentine. I promise to protect and cherish you forever.</p>
       <button class="close-btn" onclick="location.reload()">Close</button>
     </div>
  </section>


  

  
  <script>
    const meow = document.getElementById('meow');
    window.addEventListener('load', () => {
      meow.play();
      this.uia = uia;
    });
   
 
    // when hovering the button, it will move to a random position
    const noBtn = document.getElementById('no-button');
    const swish = document.getElementById('swish');
    const uia = document.getElementById('uia');
    const happyCat = document.getElementById('happy-cat');
    
    // when in mobile (click)
    noBtn.addEventListener('click', () => {
      swish.play();
      uia.play();

     // trigger yes button shake animation when hovering the no button multiple times
        const yesBtn = document.getElementById('yes-button');
        yesBtn.classList.add('yes-btn-shake');
        setTimeout(() => {
          yesBtn.classList.remove('yes-btn-shake');
        }, 4000);
  
      // move the no button to a random position
      // limit the random position of the noBtn to not overflow the window or size of the body  
     
      const container = document.querySelector(".main");
      container.style.position = "relative";
      const containerRect = container.getBoundingClientRect();
      const buttonRect = noBtn.getBoundingClientRect();
      
      const x = Math.random() * (containerRect.width - buttonRect.width);
      const y = Math.random() * (containerRect.height - buttonRect.height);
      
      //add the UIAICatMeme animation class to the no button
      noBtn.classList.add('no-button-animation');
      
      setTimeout(() => {
        noBtn.classList.remove('no-button-animation');
      }, 1500);
      noBtn.style.position = 'absolute';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });



    // when in desktop
    noBtn.addEventListener('mouseover', () => {
      swish.play();
      uia.play();

     // trigger yes button shake animation when hovering the no button multiple times
        const yesBtn = document.getElementById('yes-button');
        yesBtn.classList.add('yes-btn-shake');
        setTimeout(() => {
          yesBtn.classList.remove('yes-btn-shake');
        }, 4000);
  
      // move the no button to a random position
      // limit the random position of the noBtn to not overflow the window or size of the body  
     
      const container = document.querySelector(".main");
      container.style.position = "relative";
      const containerRect = container.getBoundingClientRect();
      const buttonRect = noBtn.getBoundingClientRect();
      
      const x = Math.random() * (containerRect.width - buttonRect.width);
      const y = Math.random() * (containerRect.height - buttonRect.height);
      
      //add the UIAICatMeme animation class to the no button
      noBtn.classList.add('no-button-animation');
      
      setTimeout(() => {
        noBtn.classList.remove('no-button-animation');
      }, 1500);
      noBtn.style.position = 'absolute';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    

   


    // popup when clicking the yes button
    const yesBtn = document.getElementById('yes-button');
    const popup = document.querySelector('.popup');
    const closeBtn = document.querySelector('.close-btn');
    const confettiSound = document.getElementById('confetti');
    const baloonPop = document.getElementById('baloon-pop');

    popup.style.display = 'none';

    happyCat.style.display = 'none';
    yesBtn.addEventListener('click', () => {
      popup.style.display = 'flex';
      noBtn.style.display = 'none';
      happyCat.style.display = 'block';
      document.querySelector('body').style.backdropFilter = 'blur(10px)';

      // when the yes button is clicked we will display a confetti animation and play the happyCat video and meow sound effect
      // Create and display confetti animation
      confettiSound.play();
      const confettiContainer = document.createElement('div');
      confettiContainer.style.position = 'fixed';
      confettiContainer.style.top = '0';
      confettiContainer.style.left = '0';
      confettiContainer.style.width = '100%';
      confettiContainer.style.height = '100%';
      confettiContainer.style.pointerEvents = 'none';
      document.body.appendChild(confettiContainer);
      confettiSound.play();
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'absolute';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.borderRadius = '50%';
        confetti.style.top = `${Math.random() * 100}%`;
        confetti.style.left = `${Math.random() * 100}%`;
        confetti.style.animation = `fall ${Math.random() * 3 + 2}s ease-out forwards`;
        confetti.style.opacity = '0.8';
        confettiContainer.appendChild(confetti);
      }

      // Define the falling animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes fall {
          0% {
        transform: translateY(0) rotate(0deg);
          }
          100% {
        transform: translateY(100vh) rotate(720deg);
          }
        }
      `;
      document.head.appendChild(style);

      // Remove confetti after animation ends
      setTimeout(() => {
        confettiContainer.remove();
        style.remove();
      }, 5000);
      baloonPop.play();
      confettiSound.play();
      happyCat.play();
      meow.play();
      
    });
    // Loop the happyCat video until the close button is clicked
    happyCat.addEventListener('ended', () => {
      if (popup.style.display === 'flex') {
      happyCat.play();
      }
    });

    // close the popup when clicking the close button (closes the window)
    closeBtn.addEventListener('click', () => {
      popup.style.display = 'none';
     
    });
    

  </script>
</body>
</html>
