<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meow Page — Create</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <header class="create-header">
    <a href="index.html" class="back-link">← Meow Page</a>
  </header>

  <main class="create-layout">

    <section class="editor-pane">
      <h2>Customize</h2>

      <div class="field">
        <label for="recipientInput">To:</label>
        <input type="text" id="recipientInput" placeholder="Someone" />
      </div>

      <div class="field">
        <label for="messageInput">Message:</label>
        <textarea id="messageInput" placeholder="Write your message here..."></textarea>
      </div>

      <div class="field">
        <label for="senderInput">From:</label>
        <input type="text" id="senderInput" placeholder="You" />
      </div>

      <div class="field">
        <label>Cat:</label>
        <div class="cat-options">
          <button class="cat-option" data-cat="🐱">🐱</button>
          <button class="cat-option" data-cat="🐈">🐈</button>
          <button class="cat-option" data-cat="🐈‍⬛">🐈‍⬛</button>
          <button class="cat-option" data-cat="😺">😺</button>
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" id="sendBtn">SEND MEOW 💌</button>
        <button class="btn btn-secondary" id="copyBtn">COPY 📋</button>
        <button class="btn btn-secondary" id="shareBtn">SHARE ↗</button>
      </div>
    </section>

    <section class="preview-pane">
      <div class="postcard" id="postcard">
        <div class="postcard-inner" id="postcardInner">

          <div class="postcard-front">
            <div class="postcard-paper postcard-paper-front">
              <div class="postcard-postmark">🐾</div>

              <div class="postcard-cat-frame">
                <div class="postcard-cat" id="postcardCat">🐱</div>
              </div>

              <div class="postcard-greeting-front">A MEOW<br />FOR YOU</div>
            </div>
          </div>

          <div class="postcard-back">
            <div class="postcard-paper postcard-paper-back">

              <div class="postcard-back-left">
                <div class="postcard-dateplace">🐾 somewhere, today</div>
                <div class="postcard-message-box">
                  <div class="postcard-message" id="postcardMessage">Hello!</div>
                </div>
              </div>

              <div class="postcard-divider"></div>

              <div class="postcard-back-right">
                <div class="postcard-stamp-box">
                  <span class="postcard-stamp-cat">🐱</span>
                  <span class="postcard-stamp-label">MEOW<br />POST</span>
                </div>

                <div class="postcard-to-row">
                  <span class="postcard-label">To:</span>
                  <span class="postcard-to" id="postcardTo"></span>
                </div>

                <div class="postcard-address-lines">
                  <span class="address-line"></span>
                  <span class="address-line"></span>
                  <span class="address-line"></span>
                </div>

                <div class="postcard-from-row">
                  <span class="postcard-label">From:</span>
                  <span class="postcard-from" id="postcardFrom"></span>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/postcard.js"></script>
  <script src="js/share.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
