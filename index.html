<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/x-icon/jpg" href="img/cat2.jpg" sizes="16x16">
<title>meow meow</title>
</head>
<body>

<div class="nav-container">
  <nav>
    <ul>
      <li><a id="showSong" href="#">Browse Your Cute Songs</a><p>I remember you when I listen to these songs</p></li>
    </ul>
  </nav>
</div>

<div class="card">
  <div class="front">
    <h1>Hover me!</h1>
  </div>
  <div class="back"></div>
  <div class="first-page">
    <p>Hello Cutie!</p>
    <button id="reveal-btn">Click Me!</button>
  </div>
</div>

<section class="songs-container" id="songContainer">
  <button id="closeSongs" class="close-btn">✖</button>

  <div class="now-playing">
    <div class="record"></div>
    <div class="song-info">
      <h3 id="currentTitle">No song playing</h3>
      <p id="currentArtist">...</p>
    </div>
  </div>

  <div class="song-card" data-artist="ILLIT" data-title="NOT CUTE ANYMORE" data-src="music/music/ILLIT (아일릿) 'Not cute anymore' (Color Coded Lyrics).mp3">
    <img src="music/music-poster/not cute poster.jfif" alt="Song 1">
    <h3>NOT CUTE ANYMORE</h3>
    <p>ILLIT</p>

      <!-- Custom Player -->
    <div class="custom-player">
      <input type="range" class="slider" value="0" min="0" max="100">
      <div class="controls">
        <button class="play-btn">▶</button>
        <span class="time">0:00 / 0:00</span>
      </div>
      <audio class="audio-player" controls></audio>
    </div>
  </div>

  <div class="song-card" data-artist="WILLOW" data-title="Wait a Minute!" data-src="music/music/WILLOW - Wait A Minute! (Lyrics).mp3">
    <img src="music/music-poster/wait a minute.jpg" alt="Song 2">
    <h3>Wait a Minute!</h3>
    <p>WILLOW</p>

      <!-- Custom Player -->
      <div class="custom-player">
        <input type="range" class="slider" value="0" min="0" max="100">
        <div class="controls">
          <button class="play-btn">▶</button>
          <span class="time">0:00 / 0:00</span>
        </div>
        <audio class="audio-player" controls></audio>
      </div>
  </div>
  
</section>


<script src="script.js"></script>  

</body>
</html>
