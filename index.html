<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #e78989;
  height: 100vh;
  font-family: Poppins, sans-serif;
}

.card {
  position: relative;
  width: 220px;
  height: 220px;
  z-index: 10;
}

.card .front,
.card .back,
.card .first-page {
  position: absolute;
  inset: 0;
  border: 10px solid #000;
  transform-origin: left center;
  transition: transform .8s ease;
}

.front {
  background: #ee2c00;
  z-index: 3;
}

.back {
  background: #ee2c00;
  z-index: 2;
}

.first-page {
  background: #e9e9e9;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.first-page p {
  font-size: 18px;
  font-weight: bold;
  color: #333;
}

.card:hover .front,
.card:hover .back {
  transform: perspective(800px) rotateY(-170deg);
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  background: #ee2c00;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #cc2400;
}

button:active {
  transform: scale(0.95);
}

.rain {
  position: fixed;
  top: -50px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .card {
    width: 160px;
    height: 160px;
  }

  .card .front h1 {
    margin-top: 50px;
    font-size: 18px;
  }

  .card .front,
  .card .back,
  .card .first-page {
    border-width: 6px;
  }

  .first-page p {
    font-size: 14px;
    text-align: center;
  }

  button {
    font-size: 13px;
    padding: 8px 14px;
  }

  .rain {
    font-size: 13px;
  }
}

</style>
</head>

<body>

<div class="card">
  <div class="front">
    <h1 style="margin-top:80px;text-align:center;">Hover me!</h1>
  </div>
  <div class="back"></div>
  <div class="first-page">
    <p>Hello Cutie!</p>
    <button id="reveal-btn">Click Me!</button>
  </div>
</div>

<script>
    const btn = document.getElementById("reveal-btn");
    
    btn.addEventListener("click", () => {
      playSound("soundfx/click.mp3");
      playSound("soundfx/fairydust.mp3");
    
      for (let i = 0; i < 10; i++) {
        createRain();
        createRain2();
        createRain3();
        name();
      }
    });
    
    function playSound(src) {
      const sound = new Audio(src);
      sound.play();
    }
    
    function createRain() {
      const drop = document.createElement("div");
      drop.classList.add("rain");
      drop.textContent = "You are so cute 😍";
    
      drop.style.left = Math.random() * window.innerWidth + "px";
      drop.style.animationDuration = Math.random() * 4 + 4 + "s";
    
      document.body.appendChild(drop);
    
      setTimeout(() => drop.remove(), 6000);
    }
     
    function createRain2() {
      const drop = document.createElement("div");
      drop.classList.add("rain");
      drop.textContent = "I like you a lot! 🥰";
    
      drop.style.left = Math.random() * window.innerWidth + "px";
      drop.style.animationDuration = Math.random() * 3 + 3 + "s";
    
      document.body.appendChild(drop);
    
      setTimeout(() => drop.remove(), 5000);
    }
    function createRain3() {
      const drop = document.createElement("div");
      drop.classList.add("rain");
      drop.textContent = "Will you be my valentine? 💖";
    
      drop.style.left = Math.random() * window.innerWidth + "px";
      drop.style.animationDuration = Math.random() * 2 + 2 + "s";
    
      document.body.appendChild(drop);
    
      setTimeout(() => drop.remove(), 4000);
    }
    function name() {
      const drop = document.createElement("div");
      drop.classList.add("rain");
      drop.textContent = "Aljane 💖";
    
      drop.style.left = Math.random() * window.innerWidth + "px";
      drop.style.animationDuration = Math.random() * 1 + 1 + "s";
    
      document.body.appendChild(drop);
    
      setTimeout(() => drop.remove(), 4000);
    }
  </script>  

</body>
</html>
